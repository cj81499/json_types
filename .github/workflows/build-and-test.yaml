name: Build and test

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install the project
        run: uv sync --locked --dev # --all-extras

      - name: Check code format (ruff)
        run: uv run ruff format --check .

      - name: Check code format (tombi)
        run: uv run tombi format --check

      - name: Lint code (ruff)
        run: uv run ruff check .

      - name: Lint code (tombi)
        run: uv run tombi lint

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Run tests (pytest)
        run: uv run coverage run -m pytest .

      - name: Build package
        if: ${{ matrix.python-version == '3.13' }} # build only on latest supported Python
        run: |
          export SOURCE_DATE_EPOCH=$(date +%s)
          echo "SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
          uv build

      - name: Upload package distributions to GitHub
        if: ${{ matrix.python-version == '3.13' }} # upload only on latest supported Python
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/
          if-no-files-found: error
